name: Clean Urban Energy
description: 'Clean Urban Energy, Inc. was a Chicago, Illinois cleantech company that
  turned large commercial office buildings into grid-scale thermal energy storage assets.
  Its technology harnessed the existing thermal mass of a building — concrete, drywall,
  furnishings — by pre-cooling during off-peak hours and coasting through peak demand,
  effectively operating the building as a multi-megawatt battery for demand response
  and load shifting without installing dedicated storage hardware. The company raised
  a reported $7 million venture round and appears in the Battery Ventures list of all
  portfolio companies. As of a July 2026 review the company has no live corporate web
  presence: the cleanurbanenergy.com domain no longer serves company content, and no
  developer portal, API, documentation, or GitHub organization could be located. It is
  catalogued here as an inactive, non-API-provider company record.'
